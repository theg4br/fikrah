name: Backend checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: fikrah_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fikrah_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FIKRAH_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only@127.0.0.1:5432/fikrah_ci_test
      FIKRAH_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:ci-only@127.0.0.1:5432/fikrah_ci_test
      REDIS_URL: redis://127.0.0.1:6379/0
      FIKRAH_JWT_SECRET: ci-only-signing-secret-with-at-least-32-characters
      FIKRAH_TEST_DOCKER_IMAGE: fikrah:ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check app tests scripts infra
      - name: Build runtime image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$FIKRAH_TEST_DOCKER_IMAGE" .
      - name: Full suite with real PostgreSQL and Redis
        run: python -m pytest -q --junitxml=ci-results.xml
      - name: Require integration tests to pass without skips
        run: python scripts/check_ci_results.py ci-results.xml
      - name: Apply migrations to disposable CI database
        run: python -m alembic upgrade head
      - name: Check application startup and task registration
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          from app.db.base import Base
          from app.workers.celery_app import celery_app
          from app.workers.routing import TASK_ROUTES
          with TestClient(app) as client:
              assert client.get('/health').status_code == 200
              assert client.get('/openapi.json').status_code == 200
          celery_app.loader.import_default_modules()
          registered = {name for name in celery_app.tasks if name.startswith('app.')}
          assert registered == set(TASK_ROUTES)
          assert {'users', 'projects', 'notes'} <= Base.metadata.tables.keys()
          PY
      - name: Package the tested image for main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          python infra/azure-vm/package_ci_release.py
          --image "$FIKRAH_TEST_DOCKER_IMAGE" --revision "$GITHUB_SHA"
          --output "$RUNNER_TEMP/fikrah-bundle"
      - name: Upload main release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fikrah-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fikrah-bundle/fikrah-release.tar.gz
            ${{ runner.temp }}/fikrah-bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy main to Azure VM
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: demo
      url: https://fikrah-api-23107c84.austriaeast.cloudapp.azure.com/docs
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download the tested bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fikrah-release-${{ github.sha }}
          path: ${{ runner.temp }}/fikrah-bundle
      - name: Verify and publish immutable deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fikrah-bundle"
          sha256sum --check SHA256SUMS
          tag="demo-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir existing
            cmp SHA256SUMS existing/SHA256SUMS
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Demo $GITHUB_SHA" --notes "Tested backend container and deployment tools. No runtime credentials." \
              --prerelease fikrah-release.tar.gz SHA256SUMS
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Sign in to Azure using OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install the release and require guest readiness
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
        run: >-
          python infra/azure-vm/deploy_ci_release.py
          --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"
          --subscription "$AZURE_SUBSCRIPTION_ID"
          --resource-group "$AZURE_RESOURCE_GROUP" --vm "$AZURE_VM_NAME"
          --checksums "$RUNNER_TEMP/fikrah-bundle/SHA256SUMS"
          --script "$RUNNER_TEMP/fikrah-deploy.sh"
      - name: Check public HTTPS readiness
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://fikrah-api-23107c84.austriaeast.cloudapp.azure.com/ready', timeout=20) as response:
              assert response.status == 200 and json.load(response)['status'] == 'ready'
          PY
